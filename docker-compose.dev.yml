version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: polybet-web-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - polybet-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: polybet-api-dev
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres:5432/polybet?schema=public
      - PORT=3001
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    command: npm run start:dev
    networks:
      - polybet-network

  postgres:
    image: postgres:15-alpine
    container_name: polybet-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: polybet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - polybet-network

  redis:
    image: redis:alpine
    container_name: polybet-redis
    ports:
      - "6379:6379"
    networks:
      - polybet-network

networks:
  polybet-network:
    driver: bridge

volumes:
  postgres-data:
