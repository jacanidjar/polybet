version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: polybet-web-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3000 # Internal networking in prod
    restart: always
    depends_on:
      - api
    networks:
      - polybet-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: polybet-api-prod
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:password@postgres:5432/polybet?schema=public
      - PORT=3000
    restart: always
    depends_on:
      - postgres
      - redis
    command: npm run start:prod
    networks:
      - polybet-network

  postgres:
    image: postgres:15-alpine
    container_name: polybet-postgres-prod
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: polybet
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    restart: always
    networks:
      - polybet-network

  redis:
    image: redis:alpine
    container_name: polybet-redis-prod
    restart: always
    networks:
      - polybet-network

networks:
  polybet-network:
    driver: bridge

volumes:
  postgres-data-prod:
